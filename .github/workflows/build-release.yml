name: Build Release Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（例：v1.0.1，可省略 v 前缀）'
        required: false
        default: 'v1.0.2'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = '${{ inputs.version }}'
          }
          $ver = "$ver".Trim()
          if (-not $ver) { $ver = 'v1.0.1' }
          if (-not $ver.StartsWith('v')) { $ver = "v$ver" }
          if ($ver -notmatch '^v\d+\.\d+\.\d+') {
            throw "版本号格式非法：$ver（应形如 v1.0.1）"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "本次发布版本：$ver"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name qingsong-rvm-panel `
            --icon assets/qingsong_rvm.ico `
            --add-data "assets;assets" `
            --add-data "rvm_worker.py;." `
            rvm_panel.py

      - name: Download bundled ffmpeg (win64)
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Write-Host "下载 ffmpeg：$url"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg-dist.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg-dist.zip -DestinationPath ffmpeg-dist -Force
          New-Item -ItemType Directory -Force -Path ffmpeg-bin | Out-Null
          foreach ($n in @('ffmpeg.exe', 'ffprobe.exe')) {
            $f = Get-ChildItem -Path ffmpeg-dist -Recurse -Filter $n -File | Select-Object -First 1
            if (-not $f) { throw "压缩包内未找到 $n" }
            Copy-Item $f.FullName "ffmpeg-bin/$n"
            Write-Host ("提取 {0} <- {1} ({2:N1} MB)" -f $n, $f.FullName, ($f.Length / 1MB))
          }
          $lic = Get-ChildItem -Path ffmpeg-dist -Recurse -File |
            Where-Object { $_.Name -match '^(LICENSE|COPYING)' } | Select-Object -First 1
          if ($lic) {
            Copy-Item $lic.FullName ffmpeg-bin/FFMPEG-LICENSE.txt
          } else {
            Invoke-WebRequest -Uri 'https://www.gnu.org/licenses/gpl-3.0.txt' -OutFile ffmpeg-bin/FFMPEG-LICENSE.txt -UseBasicParsing
          }
          Get-ChildItem ffmpeg-bin | Select-Object Name, Length

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $zip = "qingsong-rvm-panel-$ver-win64.zip"
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist/qingsong-rvm-panel.exe pkg/
          Copy-Item release-assets/* pkg/
          Copy-Item ffmpeg-bin/ffmpeg.exe,ffmpeg-bin/ffprobe.exe,ffmpeg-bin/FFMPEG-LICENSE.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem pkg | Select-Object Name, Length
          Write-Host "打包完成：$zip（$([math]::Round((Get-Item $zip).Length/1MB,1)) MB）"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Qingsong RVM Panel ${{ steps.ver.outputs.version }} (Windows x64)
          files: qingsong-rvm-panel-${{ steps.ver.outputs.version }}-win64.zip
          fail_on_unmatched_files: true
          body: |
            青松口播抠像面板 ${{ steps.ver.outputs.version }}（Windows x64，解压即用）

            - 修复：输出视频自动保留原片音轨（MP4 直接带原声，PNG 序列同时导出同名 .m4a），无需再手动合音轨
            - 新增：发行包内置 ffmpeg.exe / ffprobe.exe（与面板 exe 同级），下载后无需再单独安装 ffmpeg 即可保留原声

            使用：解压 → 双击 `一键装环境.bat`（一次性安装 GPU 依赖）→ 双击 `qingsong-rvm-panel.exe`
