name: Build Release Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name qingsong-rvm-panel `
            --icon assets/qingsong_rvm.ico `
            --add-data "assets;assets" `
            --add-data "rvm_worker.py;." `
            rvm_panel.py

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist/qingsong-rvm-panel.exe pkg/
          Copy-Item release-assets/* pkg/
          Compress-Archive -Path pkg/* -DestinationPath qingsong-rvm-panel-v1.0.0-win64.zip -CompressionLevel Optimal
          Get-ChildItem pkg | Select-Object Name, Length

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Qingsong RVM Panel v1.0.0 (Windows x64)
          files: qingsong-rvm-panel-v1.0.0-win64.zip
          fail_on_unmatched_files: true
